name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install

    - name: Run Backend Tests
      run: npm test --workspace=apps/backend
      continue-on-error: true # temporarily ignore until tests are fully written

    - name: Run Mobile Tests
      run: npm test --workspace=apps/mobile
      continue-on-error: true # temporarily ignore until tests are fully written

    - name: Run Mobile Lint
      run: npm run lint --workspace=apps/mobile
