version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: manhole-tracker-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manhole_tracker
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d manhole_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
